name: Stage Android 0.4.28 release files
on:
  workflow_dispatch:
    inputs:
      apk_download_url:
        description: Temporary transfer URL for the verified signed APK
        required: true
        type: string
      source_download_url:
        description: Temporary transfer URL for the matching source archive
        required: true
        type: string
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          APK_URL: ${{ inputs.apk_download_url }}
          SOURCE_URL: ${{ inputs.source_download_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$APK_URL"
          echo "::add-mask::$SOURCE_URL"
          python3 - <<'PY'
          import hashlib,json,os,urllib.request,urllib.parse
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='therexdev/kai-android-agent'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers=headers),timeout=60) as r:
                  return json.load(r)
          release=api('releases/455558533')
          assert release['draft'] and release['tag_name']=='v0.4.28'
          specs=[
            ('KAI-Android-0.4.28.apk','APK_URL',125095883,'37706b3537e5665f9fa639d910a1602109e164f821a3edf15163f13ef6046f9a'),
            ('KAI-Android-0.4.28-source.zip','SOURCE_URL',101387991,'e6be9a37b5360b66acfc4255995f3058bc21b6b05474121560162fce88968e5f')]
          folder=Path(os.environ['RUNNER_TEMP'])/'verified-release'
          folder.mkdir()
          for name,key,size,digest in specs:
              url=os.environ[key]
              assert urllib.parse.urlparse(url).scheme=='https'
              path=folder/name
              with urllib.request.urlopen(url,timeout=120) as response,path.open('wb') as out:
                  while chunk:=response.read(1024*1024):
                      out.write(chunk)
              assert path.stat().st_size==size
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
              matches=[a for a in release['assets'] if a['name']==name]
              if matches:
                  assert len(matches)==1 and matches[0]['state']=='uploaded' and matches[0]['size']==size and matches[0]['digest']=='sha256:'+digest
                  continue
              upload_headers=dict(headers,**{'Content-Type':'application/octet-stream'})
              request=urllib.request.Request('https://uploads.github.com/repos/'+repo+'/releases/455558533/assets?name='+urllib.parse.quote(name),data=path.read_bytes(),headers=upload_headers,method='POST')
              with urllib.request.urlopen(request,timeout=180) as response:
                  asset=json.load(response)
              assert asset['name']==name and asset['size']==size and asset['digest']=='sha256:'+digest
              print('Attached verified asset:',name)
          PY
