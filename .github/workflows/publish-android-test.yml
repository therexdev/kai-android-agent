name: Publish verified Android test APK
on:
  push:
    branches: [main]
    paths: [qa/0.5.0/publish.json]
permissions:
  contents: write
concurrency:
  group: android-test-release-0-5-0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the already signed test artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          from urllib.parse import urlparse
          manifest=json.loads(pathlib.Path('qa/0.5.0/publish.json').read_text())
          assert manifest['tag']=='v0.5.0-alpha.1'
          assert manifest['filename']=='KAI-Android-0.5.0.apk'
          source=urlparse(manifest['artifact_url'])
          assert source.scheme=='https' and source.hostname
          assert source.hostname.endswith(('.blob.core.windows.net','.oaiusercontent.com','.amazonaws.com'))
          expected=json.loads(pathlib.Path('qa/0.5.0/SOURCE_HASHES.json').read_text())
          for name,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest, name
          with urllib.request.urlopen(manifest['artifact_url'],timeout=180) as response:
              with open(manifest['filename'],'wb') as output:
                  while chunk:=response.read(1048576): output.write(chunk)
          apk=pathlib.Path(manifest['filename'])
          assert apk.stat().st_size==manifest['bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==manifest['sha256']
          pathlib.Path('KAI-Android-0.5.0-SHA256SUMS.txt').write_text(manifest['sha256']+'  '+manifest['filename']+'\n')
          PY
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose --print-certs KAI-Android-0.5.0.apk > apk-certificate.txt
          grep -F 'a6b0360e7512c4f9f9d6279b52b8ca94d3eb72f6edcf8d7295d117c76b6d3d89' apk-certificate.txt
      - name: Publish the testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.5.0-alpha.1
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --pattern KAI-Android-0.5.0.apk --dir existing
            cmp existing/KAI-Android-0.5.0.apk KAI-Android-0.5.0.apk
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title 'KAI Android 0.5.0 — shared runtime test build' --notes-file qa/0.5.0/RELEASE.md KAI-Android-0.5.0.apk KAI-Android-0.5.0-SHA256SUMS.txt
          fi
